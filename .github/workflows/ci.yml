name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: E2E smoke test (Playwright + Electron)
        run: pnpm exec playwright test
        env:
          BLUELY_E2E: '1'

  linux:
    # Unit tests that need a POSIX shell (the release workflow's publish step, run with a fake gh)
    # are skipped on Windows, so they run here, together with the capture E2E that only exists on
    # Linux: Chromium's fake microphone through the audio pipeline, and desktop loopback from a
    # private PulseAudio daemon (null sink) to a transcript line and a suggestion.
    name: Typecheck, lint, test, capture E2E (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install PulseAudio and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils xvfb xauth

      # Ubuntu 23.10+ lets only AppArmor-profiled programs create user namespaces, which
      # Electron's sandbox needs; without this a non-root Electron aborts at start. Allowing it
      # keeps the sandbox on (--no-sandbox is used only when running as root).
      - name: Allow Electron's sandbox (unprivileged user namespaces)
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build (with the audio test harness page)
        run: pnpm build
        env:
          BLUELY_HARNESS: '1'

      - name: Capture E2E (fake mic pipeline, PulseAudio loopback)
        run: >-
          xvfb-run -a -s "-screen 0 1600x1000x24"
          pnpm exec playwright test tests/e2e/audio.spec.ts tests/e2e/liveaudio.spec.ts

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capture-e2e-linux
          path: test-results/
          retention-days: 7
