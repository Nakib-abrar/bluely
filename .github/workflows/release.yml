name: Release

# Builds the Windows NSIS installer + portable .exe with electron-builder.
# - Push a tag `v<version>` (matching package.json) to publish a GitHub Release with the
#   Setup exe, portable exe, blockmap, latest.yml (read by the auto-updater) and SHA256SUMS.txt.
# - Run manually (workflow_dispatch) for a dry run that only uploads workflow artifacts, or with
#   `publish` checked on a `v*` tag to (re)publish that release.
#
# electron-builder only packages (--publish never); the "Publish" step uploads the files with gh.
# electron-builder's own publisher silently skips (exit 0) a release published more than 2 hours
# ago, which made a re-run attach SHA256SUMS.txt for binaries that were never uploaded. Now a new
# release is created as a draft and published only after every file, checksums last, is attached
# (the auto-updater never sees a half-uploaded release); a re-run replaces all files of an
# existing release from the same build; and any failed upload fails the job.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to the GitHub Release (only when run on a v* tag). Unchecked = dry run.'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and release (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish == true }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Resolve version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Bluely $VERSION (publish: $PUBLISH, ref: $GITHUB_REF)"
          # The release is tagged v<package.json version> (and latest.yml names that version);
          # refuse to publish from any other ref so a release can never point at the wrong commit.
          if [ "$PUBLISH" = "true" ] && [ "$GITHUB_REF" != "refs/tags/v$VERSION" ]; then
            echo "::error::Publishing needs the tag v$VERSION (from package.json), but this run is on $GITHUB_REF."
            exit 1
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Package
        run: pnpm exec electron-builder --win --x64 --publish never

      - name: SHA-256 checksums
        shell: bash
        working-directory: release
        run: |
          # Normalise "hash *file" (binary-mode marker on Windows) to the usual "hash  file".
          sha256sum "Bluely-Setup-$VERSION.exe" "Bluely-$VERSION-portable.exe" \
            | sed 's/ \*/  /' > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo "### Bluely $VERSION: SHA-256 checksums"
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo
            echo 'Verify on Windows: `Get-FileHash .\Bluely-Setup-'"$VERSION"'.exe -Algorithm SHA256`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to GitHub Releases
        if: env.PUBLISH == 'true'
        shell: bash
        working-directory: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="v$VERSION"
          # Upload order matters when replacing the files of a release that is already public:
          # installers first, then latest.yml (which points the auto-updater at them), then the
          # checksums of exactly these installers.
          ASSETS=(
            "Bluely-Setup-$VERSION.exe"
            "Bluely-Setup-$VERSION.exe.blockmap"
            "Bluely-$VERSION-portable.exe"
            latest.yml
            SHA256SUMS.txt
          )
          for f in "${ASSETS[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::release/$f was not built; nothing was uploaded."
              exit 1
            fi
          done
          if IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft)"; then
            echo "Release $TAG already exists (draft: $IS_DRAFT); replacing all of its files."
          else
            gh release create "$TAG" --draft --verify-tag --title "Bluely $VERSION" \
              --notes "What changed: [CHANGELOG.md](https://github.com/$GH_REPO/blob/$TAG/CHANGELOG.md). Check downloads against SHA256SUMS.txt (see the README, Install)."
          fi
          # One file per call so the order holds; any failed upload stops the job here, before
          # SHA256SUMS.txt is attached and before the release is published.
          for f in "${ASSETS[@]}"; do
            gh release upload "$TAG" "$f" --clobber
          done
          gh release edit "$TAG" --draft=false
          echo "Published $TAG: ${ASSETS[*]}"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bluely-${{ env.VERSION }}-windows-x64
          path: |
            release/Bluely-Setup-*.exe
            release/Bluely-Setup-*.exe.blockmap
            release/Bluely-*-portable.exe
            release/latest.yml
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
